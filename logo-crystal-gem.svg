<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Outer Glow Filter -->
    <filter id="gemGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Star Glow Filter -->
    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="starBlur" />
      <feComposite in="SourceGraphic" in2="starBlur" operator="over" />
    </filter>

    <!-- Gradients for Facets -->
    <linearGradient id="facetTop" x1="20" y1="12" x2="44" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="facetCrownLeft" x1="12" y1="24" x2="32" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="facetCrownRight" x1="52" y1="24" x2="32" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="facetPavilionLeft" x1="12" y1="24" x2="32" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>

    <linearGradient id="facetPavilionCenter" x1="32" y1="24" x2="32" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e879f9" />
      <stop offset="40%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>

    <linearGradient id="facetPavilionRight" x1="52" y1="24" x2="32" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="60%" stop-color="#be185d" />
      <stop offset="100%" stop-color="#500724" />
    </linearGradient>

    <!-- Aura Halo Background -->
    <radialGradient id="auraGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.65" />
      <stop offset="45%" stop-color="#8b5cf6" stop-opacity="0.4" />
      <stop offset="75%" stop-color="#06b6d4" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Radiant Aura Halo (Hào Quang Game) -->
  <circle cx="32" cy="30" r="28" fill="url(#auraGlow)" />

  <!-- Outer Gem Glow & Silhouette -->
  <g filter="url(#gemGlow)">
    <!-- Pavilion (Bottom facets) -->
    <!-- Pavilion Left -->
    <polygon points="12,24 23,24 32,54" fill="url(#facetPavilionLeft)" />
    <!-- Pavilion Center-Left -->
    <polygon points="23,24 32,24 32,54" fill="url(#facetPavilionCenter)" opacity="0.85" />
    <!-- Pavilion Center-Right -->
    <polygon points="32,24 41,24 32,54" fill="url(#facetPavilionCenter)" />
    <!-- Pavilion Right -->
    <polygon points="41,24 52,24 32,54" fill="url(#facetPavilionRight)" />

    <!-- Crown (Upper Facets) -->
    <!-- Crown Left Corner -->
    <polygon points="12,24 20,12 23,24" fill="url(#facetCrownLeft)" />
    <!-- Crown Center-Left Triangle -->
    <polygon points="20,12 32,12 23,24" fill="#a78bfa" opacity="0.9" />
    <!-- Crown Center-Right Triangle -->
    <polygon points="32,12 44,12 41,24" fill="#f472b6" opacity="0.9" />
    <!-- Crown Right Corner -->
    <polygon points="44,12 52,24 41,24" fill="url(#facetCrownRight)" />

    <!-- Center Upper Table Facet (Brightest Reflection) -->
    <polygon points="23,24 32,12 41,24 32,24" fill="url(#facetTop)" />

    <!-- Facet Edge Highlights (Chiseled Sharp Borders) -->
    <polyline points="20,12 12,24 32,54 52,24 44,12 20,12" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.75" />
    <line x1="23" y1="24" x2="32" y2="54" stroke="#e0e7ff" stroke-width="0.75" opacity="0.6" />
    <line x1="32" y1="24" x2="32" y2="54" stroke="#ffffff" stroke-width="0.8" opacity="0.8" />
    <line x1="41" y1="24" x2="32" y2="54" stroke="#fce7f3" stroke-width="0.75" opacity="0.6" />
    <polyline points="12,24 52,24" stroke="#ffffff" stroke-width="0.9" opacity="0.85" />
    <line x1="20" y1="12" x2="23" y2="24" stroke="#ffffff" stroke-width="0.7" opacity="0.6" />
    <line x1="32" y1="12" x2="23" y2="24" stroke="#ffffff" stroke-width="0.7" opacity="0.6" />
    <line x1="32" y1="12" x2="41" y2="24" stroke="#ffffff" stroke-width="0.7" opacity="0.6" />
    <line x1="44" y1="12" x2="41" y2="24" stroke="#ffffff" stroke-width="0.7" opacity="0.6" />
  </g>

  <!-- Big Sparkle on Top-Right Crown (Tia Sáng Lấp Lánh) -->
  <g filter="url(#starGlow)" transform="translate(42, 12)">
    <path d="M 0,-6 Q 0,0 6,0 Q 0,0 0,6 Q 0,0 -6,0 Q 0,0 0,-6 Z" fill="#ffffff" />
    <circle cx="0" cy="0" r="1.5" fill="#fef08a" />
  </g>

  <!-- Small Ambient Sparkles -->
  <g filter="url(#starGlow)" transform="translate(14, 34)">
    <path d="M 0,-3.5 Q 0,0 3.5,0 Q 0,0 0,3.5 Q 0,0 -3.5,0 Q 0,0 0,-3.5 Z" fill="#67e8f9" opacity="0.85" />
  </g>
  <g filter="url(#starGlow)" transform="translate(50, 40)">
    <path d="M 0,-3 Q 0,0 3,0 Q 0,0 0,3 Q 0,0 -3,0 Q 0,0 0,-3 Z" fill="#f43f5e" opacity="0.85" />
  </g>
</svg>